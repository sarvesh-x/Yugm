openapi: "3.0.3"
info:
  title: Yugm API
  version: "1.0.0"
  description: Social live-streaming platform API. All endpoints prefixed with `/api`.
servers:
  - url: http://localhost:4000/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        username: { type: string }
        avatar: { type: string, nullable: true }
        role: { type: string, enum: [USER, HOST, MODERATOR, ADMIN] }
        isVerified: { type: boolean }
        isBlocked: { type: boolean }
        walletBalance: { type: number }
        level: { type: integer }
        xp: { type: integer }
        referralCode: { type: string, nullable: true }
    RoomRecording:
      type: object
      properties:
        _id: { type: string }
        roomId: { type: string }
        hostId: { $ref: "#/components/schemas/User" }
        title: { type: string }
        recordingUrl: { type: string, nullable: true }
        duration: { type: integer }
        viewCount: { type: integer }
        status: { type: string, enum: [PROCESSING, PUBLISHED, FAILED] }
        createdAt: { type: string, format: date-time }
    Room:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        type: { type: string, enum: [VOICE, VIDEO] }
        hostId: { $ref: "#/components/schemas/User" }
        status: { type: string, enum: [LIVE, ENDED, SCHEDULED] }
        participantCount: { type: integer }
        category: { type: string }
        language: { type: string }
    WalletTransaction:
      type: object
      properties:
        _id: { type: string }
        userId: { type: string }
        type: { type: string }
        amount: { type: number }
        balanceAfter: { type: number }
        label: { type: string }
        referenceId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Game:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        icon: { type: string }
        best: { type: object, nullable: true }
    PkBattle:
      type: object
      properties:
        _id: { type: string }
        leftRoomId: { type: string }
        rightRoomId: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, ENDED, FORCE_ENDED] }
        leftScore: { type: integer }
        rightScore: { type: integer }
        createdAt: { type: string, format: date-time }
    Story:
      type: object
      properties:
        _id: { type: string }
        userId: { $ref: "#/components/schemas/User" }
        mediaUrl: { type: string }
        mediaType: { type: string, enum: [IMAGE, VIDEO] }
        caption: { type: string, nullable: true }
        viewedBy: { type: array, items: { type: string } }
        likeCount: { type: integer }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, EXPIRED, HIDDEN] }
    StoryFeed:
      type: object
      properties:
        stories:
          type: object
          additionalProperties:
            type: object
            properties:
              user: { $ref: "#/components/schemas/User" }
              stories: { type: array, items: { $ref: "#/components/schemas/Story" } }
        count: { type: integer }
    Event:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        hostId: { $ref: "#/components/schemas/User" }
        coverImage: { type: string, nullable: true }
        category: { type: string }
        type: { type: string, enum: [ROOM, TOURNAMENT, SPECIAL, WORKSHOP, PARTY] }
        eventDate: { type: string, format: date-time }
        eventEndDate: { type: string, format: date-time, nullable: true }
        maxParticipants: { type: integer, nullable: true }
        participantIds: { type: array, items: { type: string } }
        status: { type: string, enum: [UPCOMING, LIVE, COMPLETED, CANCELLED] }
    ReferralStats:
      type: object
      properties:
        stats:
          type: object
          properties:
            total: { type: integer }
            completed: { type: integer }
            rewarded: { type: integer }
            totalCoins: { type: integer }
        referrals:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              referredUserId: { $ref: "#/components/schemas/User" }
              status: { type: string }
              rewardCoins: { type: integer, nullable: true }
              createdAt: { type: string, format: date-time }
    NotificationCampaign:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        body: { type: string }
        segment: { type: string, enum: [all, hosts, city, vip, custom] }
        status: { type: string, enum: [DRAFT, SCHEDULED, SENDING, SENT, CANCELLED] }
        sentCount: { type: integer }
        deliveredCount: { type: integer }
        openCount: { type: integer }
        clickCount: { type: integer }
        createdBy: { $ref: "#/components/schemas/User" }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          properties:
            message: { type: string }
            code: { type: string }

security:
  - bearerAuth: []

paths:
  # ─── AUTH ──────────────────────────────────────────────
  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Request email OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: OTP sent }
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                otp: { type: string }
      responses:
        "200": { description: Login success, returns session }

  # ─── STORIES ───────────────────────────────────────────
  /stories:
    post:
      tags: [Stories]
      summary: Create a story (24h ephemeral)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaUrl, mediaType]
              properties:
                mediaUrl: { type: string }
                mediaType: { type: string, enum: [IMAGE, VIDEO] }
                caption: { type: string, maxLength: 200 }
                backgroundColor: { type: string }
                sticker: { type: string }
                linkUrl: { type: string }
      responses:
        "201": { description: Story created }
  /stories/feed:
    get:
      tags: [Stories]
      summary: Get story feed (following + own)
      responses:
        "200":
          description: Grouped story feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryFeed"
  /stories/user/{userId}:
    get:
      tags: [Stories]
      summary: Get a user's active stories
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: User's stories }
  /stories/{storyId}/view:
    post:
      tags: [Stories]
      summary: Mark story as viewed
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewed: { type: boolean }
                  viewCount: { type: integer }
  /stories/{storyId}/like:
    post:
      tags: [Stories]
      summary: Like a story
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Liked
  /stories/{storyId}/hide:
    post:
      tags: [Stories]
      summary: Hide own story
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Hidden }
  /stories/{storyId}:
    delete:
      tags: [Stories]
      summary: Delete own story
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
  /stories/{storyId}/views:
    get:
      tags: [Stories]
      summary: Get story viewers
      parameters:
        - name: storyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Viewer list
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewers:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  count: { type: integer }

  # ─── EVENTS ────────────────────────────────────────────
  /events:
    post:
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, type, eventDate]
              properties:
                title: { type: string, minLength: 3, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
                category: { type: string }
                type: { type: string, enum: [ROOM, TOURNAMENT, SPECIAL, WORKSHOP, PARTY] }
                eventDate: { type: string, format: date-time }
                eventEndDate: { type: string, format: date-time }
                maxParticipants: { type: integer }
                tags: { type: array, items: { type: string } }
      responses:
        "201": { description: Event created }
    get:
      tags: [Events]
      summary: List events
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: upcoming
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated event list
  /events/{eventId}:
    get:
      tags: [Events]
      summary: Get event detail
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Event detail }
  /events/{eventId}/join:
    post:
      tags: [Events]
      summary: Join an event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Joined or already joined }
  /events/{eventId}/cancel:
    post:
      tags: [Events]
      summary: Cancel own event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Cancelled }
  /events/user/me:
    get:
      tags: [Events]
      summary: Get my events (hosting + joined)
      responses:
        "200":
          description: My events
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosting: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  joined: { type: array, items: { $ref: "#/components/schemas/Event" } }

  # ─── REFERRALS ─────────────────────────────────────────
  /referrals/code:
    post:
      tags: [Referrals]
      summary: Generate referral code
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  referralCode: { type: string }
    get:
      tags: [Referrals]
      summary: Get existing or auto-generate referral code
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  referralCode: { type: string }
  /referrals/claim:
    post:
      tags: [Referrals]
      summary: Claim a referral code (rewards both parties)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Referral claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  reward: { type: integer }
                  message: { type: string }
  /referrals/stats:
    get:
      tags: [Referrals]
      summary: Get referral stats and history
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralStats"

  # ─── CLANS ─────────────────────────────────────────────
  /clans/{clanId}/messages/clean:
    post:
      tags: [Clans]
      summary: Clean all clan messages (owner only)
      parameters:
        - name: clanId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messages deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount: { type: integer }

  # ─── NOTIFICATIONS ─────────────────────────────────────
  /notifications/track/{notificationId}/click:
    post:
      tags: [Notifications]
      summary: Track notification click/open
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Click tracked

  # ─── UPLOAD ────────────────────────────────────────────
  /upload/story:
    post:
      tags: [Upload]
      summary: Upload story media (image/video, max 25MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  type: { type: string, enum: [IMAGE, VIDEO] }

  # ─── ADMIN ─────────────────────────────────────────────
  /admin/notifications/campaigns:
    get:
      tags: [Admin / Campaigns]
      summary: List notification campaigns
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated campaign list
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items: { $ref: "#/components/schemas/NotificationCampaign" }
                  pagination: { type: object }
    post:
      tags: [Admin / Campaigns]
      summary: Create a campaign draft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body, segment]
              properties:
                title: { type: string, maxLength: 120 }
                body: { type: string, maxLength: 500 }
                segment: { type: string, enum: [all, hosts, city, vip, custom] }
                segmentValue: { type: string }
                scheduledFor: { type: string, format: date-time }
      responses:
        "201": { description: Campaign created }
  /admin/notifications/campaigns/{id}:
    get:
      tags: [Admin / Campaigns]
      summary: Get campaign detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Campaign detail }
  /admin/notifications/campaigns/{id}/send:
    post:
      tags: [Admin / Campaigns]
      summary: Send a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Campaign sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer }
                  delivered: { type: integer }
  /admin/notifications/campaigns/{id}/cancel:
    post:
      tags: [Admin / Campaigns]
      summary: Cancel a draft/scheduled campaign
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Campaign cancelled }
  # ─── RECORDINGS ───────────────────────────────────────
  /recordings:
    post:
      tags: [Recordings]
      summary: Start recording a live room (host only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId]
              properties:
                roomId: { type: string }
                title: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Recording started
          content:
            application/json:
              schema:
                type: object
                properties:
                  recording: { $ref: "#/components/schemas/RoomRecording" }
  /recordings/room/{roomId}:
    get:
      tags: [Recordings]
      summary: List published recordings for a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated recording list
          content:
            application/json:
              schema:
                type: object
                properties:
                  recordings: { type: array, items: { $ref: "#/components/schemas/RoomRecording" } }
                  total: { type: integer }
                  page: { type: integer }
                  totalPages: { type: integer }
  /recordings/{id}:
    get:
      tags: [Recordings]
      summary: Get recording detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Recording detail }
    patch:
      tags: [Recordings]
      summary: Update recording title (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
      responses:
        "200": { description: Recording updated }
    delete:
      tags: [Recordings]
      summary: Delete recording (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Recording deleted }
  /recordings/{id}/stop:
    patch:
      tags: [Recordings]
      summary: Stop recording and publish (host only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recordingUrl, duration]
              properties:
                recordingUrl: { type: string, format: uri }
                duration: { type: integer, minimum: 1 }
      responses:
        "200": { description: Recording published }
  /recordings/{id}/view:
    post:
      tags: [Recordings]
      summary: Increment recording view count
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: View recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewCount: { type: integer }

  # ─── WALLET ────────────────────────────────────────────
  /wallet:
    get:
      tags: [Wallet]
      summary: Get wallet balance and status
      responses:
        "200": { description: Wallet info }
  /wallet/transactions:
    get:
      tags: [Wallet]
      summary: List wallet transactions
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions: { type: array, items: { $ref: "#/components/schemas/WalletTransaction" } }

  # ─── ROOMS ─────────────────────────────────────────────
  /rooms:
    post:
      tags: [Rooms]
      summary: Create a room
      responses:
        "201": { description: Room created }
    get:
      tags: [Rooms]
      summary: List live rooms
      responses:
        "200":
          description: Live room list
          content:
            application/json:
              schema:
                type: object
                properties:
                  rooms: { type: array, items: { $ref: "#/components/schemas/Room" } }

  # ─── GAMES ─────────────────────────────────────────────
  /games/catalog:
    get:
      tags: [Games]
      summary: Get game catalog with personal bests
      responses:
        "200":
          description: Game catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  games: { type: array, items: { $ref: "#/components/schemas/Game" } }
  /games/scores:
    post:
      tags: [Games]
      summary: Submit a game score
      responses:
        "201": { description: Score recorded }
  /games/leaderboard:
    get:
      tags: [Games]
      summary: Get game leaderboard
      parameters:
        - name: gameId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Leaderboard }

  # ─── PK BATTLES ────────────────────────────────────────
  /pk/start:
    post:
      tags: [PK]
      summary: Start a PK battle between two rooms
      responses:
        "201": { description: Battle started }

  # ─── DATING ────────────────────────────────────────────
  /dating/explore:
    get:
      tags: [Dating]
      summary: Explore dating candidates
      responses:
        "200": { description: Candidate list }
  /dating/matches:
    get:
      tags: [Dating]
      summary: Get dating matches
      responses:
        "200": { description: Match list }

  # ─── FEED ──────────────────────────────────────────────
  /feed:
    get:
      tags: [Feed]
      summary: Get social feed
      responses:
        "200": { description: Feed items }

  # ─── FRIENDS ───────────────────────────────────────────
  /friends:
    get:
      tags: [Friends]
      summary: List friends
      responses:
        "200": { description: Friend list }

  # ─── WATCH PARTY ───────────────────────────────────────
  /rooms/{roomId}/watch-party:
    post:
      tags: [WatchParty]
      summary: Start a watch party in a room
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201": { description: Watch party started }
    get:
      tags: [WatchParty]
      summary: Get active watch party
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Watch party state }

  # ─── SUBSCRIPTIONS ─────────────────────────────────────
  /subscriptions/{creatorId}:
    post:
      tags: [Subscriptions]
      summary: Subscribe to a creator
      parameters:
        - name: creatorId
          in: path
          required: true
          schema: { type: string }
      responses:
        "201": { description: Subscribed }

  # ─── HIGHLIGHTS ────────────────────────────────────────
  /highlights/{userId}:
    get:
      tags: [Highlights]
      summary: Get user's story highlights
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Highlight list }

  # ─── GROUPS ────────────────────────────────────────────
  /groups:
    get:
      tags: [Groups]
      summary: List group DMs
      responses:
        "200": { description: Group list }
    post:
      tags: [Groups]
      summary: Create group DM
      responses:
        "201": { description: Group created }

  # ─── WISHLIST ──────────────────────────────────────────
  /wishlist/me:
    get:
      tags: [Wishlist]
      summary: Get my wishlist items
      responses:
        "200": { description: Wishlist items }
  /wishlist/{userId}:
    get:
      tags: [Wishlist]
      summary: Get a user's public wishlist
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: User's wishlist }

  # ─── GIFT LEADERBOARD ──────────────────────────────────
  /gift-leaderboard:
    get:
      tags: [GiftLeaderboard]
      summary: Get top gift senders and receivers
      responses:
        "200": { description: Leaderboard }

  # ─── CREATOR ───────────────────────────────────────────
  /creator/payout-kyc:
    get:
      tags: [Creator]
      summary: Get KYC status
      responses:
        "200": { description: KYC status }
  /creator/withdrawals:
    get:
      tags: [Creator]
      summary: List withdrawals
      responses:
        "200": { description: Withdrawal list }

  # ─── SUPPORT ───────────────────────────────────────────
  /support/tickets:
    post:
      tags: [Support]
      summary: Create support ticket
      responses:
        "201": { description: Ticket created }

  # ─── TRUST VERIFICATION ────────────────────────────────
  /trust-verification/status:
    get:
      tags: [TrustVerification]
      summary: Get trust verification status
      responses:
        "200": { description: Verification status }

  # ─── EXPERIENCE / LEVELS ───────────────────────────────
  /experience/home:
    get:
      tags: [Experience]
      summary: Get home screen experience data
      responses:
        "200": { description: Home experience data }

  /admin/clans/{clanId}/clean-messages:
    post:
      tags: [Admin / Moderation]
      summary: Clean clan messages (admin)
      parameters:
        - name: clanId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Messages deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount: { type: integer }

  # ─── MISSIONS & BATTLE PASS ────────────────────────────
  /missions:
    get:
      tags: [Missions]
      summary: Get active missions and daily progress
      responses:
        "200": { description: Active missions list }
  /missions/claim:
    post:
      tags: [Missions]
      summary: Claim mission reward
      responses:
        "200": { description: Reward claimed }

  /battle-pass:
    get:
      tags: [Battle Pass]
      summary: Get battle pass status and tiers
      responses:
        "200": { description: Battle pass details }
  /battle-pass/claim:
    post:
      tags: [Battle Pass]
      summary: Claim battle pass tier reward
      responses:
        "200": { description: Tier reward claimed }

  # ─── VIBE GRAPH & DISCOVER ──────────────────────────────
  /vibe/dimensions:
    get:
      tags: [Vibe]
      summary: Get 8-dimensional vibe graph
      responses:
        "200": { description: Vibe dimensions }
  /vibe/trend:
    get:
      tags: [Vibe]
      summary: Get 7-day vibe trend history
      responses:
        "200": { description: Vibe trend points }
  /vibe/matches:
    get:
      tags: [Vibe]
      summary: Get top vibe matches
      responses:
        "200": { description: Top matches list }

  /discover/trending:
    get:
      tags: [Discover]
      summary: Get trending live rooms
      responses:
        "200": { description: Trending room list }
  /discover/recommended:
    get:
      tags: [Discover]
      summary: Get AI-recommended rooms and users
      responses:
        "200": { description: Recommended content }
  /discover/hubs:
    get:
      tags: [Discover]
      summary: Get interest and language hub room counts
      responses:
        "200": { description: Hub summary counts }

