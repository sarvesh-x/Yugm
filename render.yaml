services:
  - type: web
    name: yugm-api
    runtime: node
    rootDir: backend-server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_REFRESH_SECRET
        generateValue: true
      - key: PAYOUT_KYC_ENCRYPTION_KEY
        generateValue: true
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.example.yugm
      - key: GOOGLE_PLAY_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PLAY_PRIVATE_KEY
        sync: false
      # Required: provide a MongoDB Atlas URI (or another reachable MongoDB URI).
      - key: MONGODB_URI
        sync: false
