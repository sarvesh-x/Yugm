services:
  - type: web
    name: yugm-api
    runtime: node
    rootDir: backend-server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_REFRESH_SECRET
        generateValue: true
      - key: PAYOUT_KYC_ENCRYPTION_KEY
        generateValue: true
      # Required: provide a MongoDB Atlas URI (or another reachable MongoDB URI).
      - key: MONGODB_URI
        sync: false
