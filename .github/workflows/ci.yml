name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-server/package-lock.json
      - name: Credential guard unit tests
        run: npm run test:secrets
      - name: Fail on credential-bearing values in tracked configs
        # DCR-1: owner confirmed provider rotation/revocation on 2026-11-23;
        # tracked secret values were removed and strict mode is now blocking.
        run: npm run secrets:check:strict
      - name: Report Worker deployment config findings
        # Report-only; staging/production config hardening is an owner decision.
        run: npm run worker-config:check
      - name: OpenAPI guard unit tests
        run: npm run test:openapi
      - name: Check OpenAPI structure
        run: npm run openapi:check
      - run: npm ci
      - run: npm run typecheck
      - name: Run backend unit tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:1/yugm_unit_tests
        run: npm run test
      - name: Isolated financial and gift authorization regressions
        run: npm --workspace apps/api run test:hardening
      - name: Bundle experimental Cloudflare Worker
        run: npm --workspace apps/cloudflare-worker run dry-run:staging
      - name: Verify MongoDB-free D1 Worker bundles and routes
        run: node --test apps/cloudflare-worker/test/auth-worker.mjs apps/cloudflare-worker/test/production-worker.mjs
      - name: Exercise Worker room sockets against isolated MongoDB
        run: npm --workspace apps/cloudflare-worker run test:realtime

  admin:
    name: Admin (typecheck + production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-server/package-lock.json
      - run: npm ci
      - name: Typecheck admin
        run: npm --workspace apps/admin run typecheck
      - name: Test admin
        run: npm --workspace apps/admin run test
      - name: Build admin
        run: npm --workspace apps/admin run build

  android:
    name: Android (lint + unit tests + debug build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Lint, unit tests and debug build
        run: ./gradlew :app:lintDebug testDebugUnitTest :app:assembleDebug
