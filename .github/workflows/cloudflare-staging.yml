name: Cloudflare staging

on:
  push:
    branches: [codex/cloudflare-staging]

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-staging
    defaults:
      run:
        working-directory: backend-server
    env:
      STAGING_API: https://yugm-api-staging.sarveshkumar10101.workers.dev
      STAGING_ADMIN: https://yugm-admin-staging.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Run backend unit tests
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:1/yugm_unit_tests
        run: npm run test
      - run: npm --workspace apps/api run test:hardening
      - run: npm --workspace apps/cloudflare-worker run test:realtime
      - name: Build staging admin
        env:
          VITE_ADMIN_API_URL: ${{ env.STAGING_API }}/api/admin
          VITE_ADMIN_BASE_PATH: /
        run: npm --workspace apps/admin run build
      - name: Deploy and verify staging API
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the cloudflare-staging environment.'
            exit 1
          fi
          npm --workspace apps/cloudflare-worker run deploy:staging
          curl -fsS --retry 4 --retry-all-errors --max-time 30 "$STAGING_API/health" |
            jq -e '.ok and .db.ready and (.db.name == "YugmStaging") and .storage.ready'
      - name: Deploy and verify staging admin
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --no-install wrangler pages deploy apps/admin/dist --project-name yugm-admin-staging --branch main
          curl -fsS --retry 4 --retry-all-errors --max-time 30 "$STAGING_ADMIN/" -o /dev/null
