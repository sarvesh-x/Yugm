name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag and calculate Android version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( minor >= 1000 || patch >= 1000 )); then
            echo "MINOR and PATCH values must be below 1000 to produce a valid Android version code."
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code <= 0 || version_code > 2100000000 )); then
            echo "The tag produces an Android version code outside the supported range."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Decode Android upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [[ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" ]]; then
            echo "Configure the ANDROID_UPLOAD_KEYSTORE_BASE64 repository secret before creating a release tag."
            exit 1
          fi
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yugm-upload.jks"

      - name: Build signed release APK
        working-directory: android-client
        env:
          YUGM_SERVER_MODE: deploy
          YUGM_API_BASE_URL: https://yugm.onrender.com/api
          YUGM_SOCKET_BASE_URL: https://yugm.onrender.com
          YUGM_VERSION_CODE: ${{ steps.version.outputs.code }}
          YUGM_VERSION_NAME: ${{ steps.version.outputs.name }}
          YUGM_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/yugm-upload.jks
          YUGM_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          YUGM_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          YUGM_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yugm ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: android-client/app/build/outputs/apk/release/app-release.apk
