# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Tuned for 16 GB RAM / AMD Ryzen 9 7900X (12c/24t): prioritize system responsiveness
# and avoid memory thrash when Gradle + Kotlin + lint run alongside IDE/OS.
# Total concurrent JVM heap is intentionally bounded for 16 GB machines.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Keep parallel module execution, but with conservative worker concurrency.
org.gradle.parallel=true

# Reuse task outputs and configuration across builds.
org.gradle.caching=true
org.gradle.configuration-cache=true

# Conservative worker cap to reduce CPU/memory spikes and UI freezes.
org.gradle.workers.max=2

# Keep the daemon warm between build/run cycles.
org.gradle.daemon.idletimeout=3600000

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Kotlin incremental compilation across modules. KSP is incremental by default.
kotlin.incremental=true
# Chat/Compose analysis can be memory-intensive; keep daemon heap high enough for
# large modules while preserving headroom for Gradle daemon/lint/IDE on 16 GB.
# -XX:-UseGCOverheadLimit avoids the Kotlin FIR compiler aborting with
# "GC overhead limit exceeded" on complex data-flow analysis; give the daemon a bit more heap.
kotlin.daemon.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=384m -XX:-UseGCOverheadLimit

# Android build compatibility flags currently required by this project configuration.
android.enableGlobalSynthetics=false
android.builtInKotlin=false
android.newDsl=false

# Run lint out-of-process with bounded heap to avoid exhausting the Gradle daemon.
android.experimental.runLintInProcess=false
android.experimental.lint.heapSize=2g

# Parallel Gradle sync for IDE tooling (Gradle 9.4+).
org.gradle.tooling.parallel=true
