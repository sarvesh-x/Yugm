# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 24 logical cores / 15 GB RAM available. 6 GB heap leaves room for the IDE and
# Kotlin/KSP worker daemons while avoiding GC thrash on this multi-module build.
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel module execution. Previously disabled, which forced ~20 modules to
# build serially on a 24-thread CPU.
org.gradle.parallel=true

# Reuse task outputs across builds/branches (no local cache was configured).
org.gradle.caching=true

# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true

# Cap concurrent workers so Kotlin/KSP daemons do not exhaust 15 GB of RAM.
org.gradle.workers.max=8

# Keep the daemon warm between build/run cycles instead of paying JVM startup
# again after a short idle period.
org.gradle.daemon.idletimeout=3600000

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Kotlin incremental compilation across modules. KSP (which replaced KAPT) is
# incremental by default, so no kapt.* tuning is needed anymore.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3072m

android.enableGlobalSynthetics=false
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
