services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - yugm-mongo:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  livekit:
    image: livekit/livekit-server:latest
    command: ["--dev"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  yugm-mongo:
